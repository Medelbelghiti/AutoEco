name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real Postgres so the concurrency / webhook / quota tests actually run in
    # CI instead of skipping themselves (they only run against localhost).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoeco
          POSTGRES_PASSWORD: autoeco
          POSTGRES_DB: autoeco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoeco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://autoeco:autoeco@localhost:5432/autoeco_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs `postinstall` -> `prisma generate`.
      - name: Install dependencies
        run: npm ci

      # DATABASE_URL points at the throwaway localhost service above, which the
      # test guard treats as safe to write to.
      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # `next build` (not `npm run build`): the latter runs
      # `prisma migrate deploy` against DATABASE_URL, which must never happen
      # in CI against an unconfigured or wrong database.
      - name: Build
        run: npx next build
        env:
          DATABASE_URL: postgresql://autoeco:autoeco@localhost:5432/autoeco_test
          # Satisfies the build-time production config audit without claiming a
          # real deployment is configured.
          AUTH_SECRET: ci-only-not-a-real-secret-000000000000

  launch-readiness:
    name: Launch readiness report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deliberately NOT gating. This reports pre-launch blockers (legal
    # placeholders, missing production credentials) that are resolved outside
    # of the repository, not by code changes. It is surfaced on every run so
    # they cannot be forgotten, but a red legal placeholder must not block
    # unrelated pull requests from merging.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Launch check
        run: npm run check:launch